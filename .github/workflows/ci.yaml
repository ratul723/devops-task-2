name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app

      - name: Unit tests with coverage
        run: pytest app/tests --cov=app --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        run: |
          {
            echo "## Test coverage"
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  lint-docker-and-shell:
    name: Dockerfile and shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Lint shell scripts (shellcheck)
        run: shellcheck scripts/*.sh

  build-and-scan:
    name: Build image and scan for vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: devops-task:ci
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Trivy report (HIGH and CRITICAL, informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-task:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-task:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"